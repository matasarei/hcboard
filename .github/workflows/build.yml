name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # A pull request's older run is worthless once the branch is pushed again. A run on main is
  # not: its last job deletes and re-creates the dev release, and cancelling it between the two
  # would leave no release at all, so runs on main wait their turn instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test, lint and build the debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # A stable signing key lets a new dev build install over the previous one. Without the
      # secrets the runner's throwaway debug key is used and each new build needs an uninstall.
      - name: Prepare the dev signing key
        if: ${{ env.DEV_KEYSTORE_BASE64 != '' }}
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          echo "$DEV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dev.keystore"
          echo "HCBOARD_KEYSTORE=$RUNNER_TEMP/dev.keystore" >> "$GITHUB_ENV"

      - name: Test, lint, assemble
        env:
          HCBOARD_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          HCBOARD_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          HCBOARD_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk hcboard-dev.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hcboard-dev
          path: hcboard-dev.apk
          if-no-files-found: error

      - name: Keep the test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  dev-release:
    name: Re-create the dev pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hcboard-dev

      # One rolling pre-release, re-created on every push to main so it is always the newest
      # release on the page; an edited release keeps the date it was first published and sinks.
      # The tag is moved, never deleted: GitHub turns a release into a draft when its tag is
      # deleted, and it did so asynchronously to a release re-created seconds later. Only the
      # release object is removed, and the new one is created on the tag that is already there.
      # The last loop fails the job if the new release is a draft, is not a pre-release, or has
      # no APK on it, and looks again after a pause, because that conversion arrived late.
      - name: Re-create the dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Latest build of \`main\` at ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)

          Built $(date -u +'%Y-%m-%d %H:%M UTC'). Debug build for testing, not a release.

          Install: download \`hcboard-dev.apk\`, open it on the phone (allow installs from your browser or files app), then enable and select **hcboard** under Settings › System › Keyboard › On-screen keyboard. Or with adb: \`adb install -r hcboard-dev.apk\`."
          # Every call is stamped: this step once took six minutes with nothing in the log to
          # say which of them was slow.
          say() { printf '%s %s\n' "$(date -u +%H:%M:%S)" "$1"; }
          say "moving the dev tag"
          git push --force origin "$GITHUB_SHA:refs/tags/dev"
          # Only a missing release is skipped (the first run); a delete that fails stops here,
          # with its own message, before anything else is touched.
          say "deleting the previous release"
          if gh release view dev >/dev/null 2>&1; then gh release delete dev --yes; fi
          # The APK is uploaded after the release exists rather than handed to create: gh puts a
          # create's assets on a draft and publishes only once the upload finishes, so the dev
          # release was a draft — a 404 for anyone not signed in — for as long as a 17 MB upload
          # took, six minutes on 2026-09-17. Published first, then the file.
          say "creating the release"
          gh release create dev --verify-tag --prerelease --title "Dev build" --notes "$notes"
          say "uploading the APK"
          gh release upload dev hcboard-dev.apk --clobber
          say "checking what the release ended up as"
          for pause in 0 20; do
            sleep "$pause"
            state="$(gh release view dev --json isDraft,isPrerelease,assets -q '"\(.isDraft) \(.isPrerelease) \(.assets | length)"')"
            echo "dev release after ${pause}s: draft/prerelease/assets = $state"
            test "$state" = "false true 1"
          done
