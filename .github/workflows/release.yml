name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "HCBOARD_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test, lint, and assemble release
        env:
          HCBOARD_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HCBOARD_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HCBOARD_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Package release assets
        run: |
          tag="${{ github.ref_name }}"
          cp app/build/outputs/apk/release/app-release.apk "hcboard-${tag}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "hcboard-${tag}.aab"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" \
            --title "hcboard $tag" \
            --generate-notes \
            "hcboard-${tag}.apk" \
            "hcboard-${tag}.aab"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ github.ref_name }}
          path: |
            hcboard-${{ github.ref_name }}.apk
            hcboard-${{ github.ref_name }}.aab
