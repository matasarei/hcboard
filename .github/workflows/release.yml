name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish release
    runs-on: ubuntu-latest
    env:
      # The tagged commit, which the APK reports in its diagnostics.
      HCBOARD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "HCBOARD_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test, lint, and assemble release
        env:
          HCBOARD_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HCBOARD_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HCBOARD_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Package release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          apk_file="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk_file" ]]; then
            apk_file="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          cp "$apk_file" "hcboard-${TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "hcboard-${TAG}.aab"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "hcboard $TAG" \
            --generate-notes \
            "hcboard-${TAG}.apk" \
            "hcboard-${TAG}.aab"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ github.ref_name }}
          path: |
            hcboard-${{ github.ref_name }}.apk
            hcboard-${{ github.ref_name }}.aab
